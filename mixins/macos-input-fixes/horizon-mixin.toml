[mod]
id = "macos-input-fixes"
version = "0.1.0"
priority = 100

# The Horizon Nightly this bundle is built against (the launcher's staged export,
# `native/source/9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0`).
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[crate]]
id = "engine"
path = "engine"
dependent = "horizon-client"

[[injection]]
id = "wheel-head"
target = "horizon_client::game::window_handler::Game<'_>::handle_window_event"
kind = "HEAD"
helper = "src/wheel_head.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
    { name = "event", ty = "&mut winit::event::WindowEvent", value = "&mut event" },
    { name = "origin", ty = "crate::game::input_trace::InputOrigin", value = "origin" },
]
